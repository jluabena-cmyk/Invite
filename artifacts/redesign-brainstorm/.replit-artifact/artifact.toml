kind = "slides"
previewPath = "/redesign-brainstorm/"
title = "Bill Splitter — Redesign Directions"
version = "1.0.0"
id = "artifacts/redesign-brainstorm"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/redesign-brainstorm/" ]
localPort = 21545

[services.development]
run = "pnpm --filter @workspace/redesign-brainstorm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/redesign-brainstorm", "run", "build" ]
publicDir = "artifacts/redesign-brainstorm/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21545"
BASE_PATH = "/redesign-brainstorm/"
