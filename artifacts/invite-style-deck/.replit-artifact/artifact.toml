kind = "slides"
previewPath = "/invite-style-deck/"
title = "invite — Style Directions"
version = "1.0.0"
id = "artifacts/invite-style-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/invite-style-deck/" ]
localPort = 19339

[services.development]
run = "pnpm --filter @workspace/invite-style-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/invite-style-deck", "run", "build" ]
publicDir = "artifacts/invite-style-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19339"
BASE_PATH = "/invite-style-deck/"
